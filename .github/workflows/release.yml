# The release of a native worm.
#
# larvae reads `worm.toml` beside the executable, so each archive holds both,
# and the name inside the archive is the `entry` of the manifest.
#
# larvae looks for `<name>-worm-<arch>-<os>.zip` before it tries the plain
# names, because a native worm ships one artifact for each platform. The arch
# and the os are the ones that Rust names, such as `x86_64` and `linux`, and
# the name is the key that a project writes under `[worms]`. So each archive
# below carries the name that larvae asks for, and a project names no asset.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: luaux-worm-x86_64-linux
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: luaux-worm-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: luaux-worm-aarch64-macos
          # `luaux-worm-x86_64-windows` waits for a release of `larvae-worm`
          # that gates its wasm node API behind `target_arch = "wasm32"`.
          # Until then `link.exe` refuses a native worm, and an archive with
          # no working executable in it is worse than no archive. See the
          # windows job of ci.yml.

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --release --target ${{ matrix.target }}

      # `zip` keeps the mode of a file on unix, so the executable bit survives
      # the archive. The worm and its manifest sit at the root of the archive,
      # because larvae reads the manifest beside the executable.
      - name: package
        shell: bash
        run: |
          name="${{ matrix.asset }}"
          mkdir -p "staging/$name"
          cp worm.toml "staging/$name/"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/luaux-worm.exe" "staging/$name/"
          else
            cp "target/${{ matrix.target }}/release/luaux-worm" "staging/$name/"
          fi

          cd staging && zip -r "../$name.zip" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: archives/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
