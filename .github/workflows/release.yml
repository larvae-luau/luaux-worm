# The release of a native worm.
#
# larvae reads `worm.toml` beside the executable, so each archive holds both,
# and the name inside the archive is the `entry` of the manifest.
#
# A project takes this worm with `path` today. larvae does not set the
# executable bit when it unpacks an archive, and it has no name for the
# platform of the machine yet, so a release cannot run on unix until it does.
# The archives wait here for that day, and the name of each one says which
# platform it holds.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --release --target ${{ matrix.target }}

      # `zip` keeps the mode of a file on unix, so the executable bit survives
      # the archive. The worm and its manifest sit at the root of the archive,
      # because larvae reads the manifest beside the executable.
      - name: package
        shell: bash
        run: |
          name="luaux-worm-${{ matrix.target }}"
          mkdir -p "staging/$name"
          cp worm.toml "staging/$name/"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/luaux-worm.exe" "staging/$name/"
          else
            cp "target/${{ matrix.target }}/release/luaux-worm" "staging/$name/"
          fi

          cd staging && 7z a "../$name.zip" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: luaux-worm-${{ matrix.target }}
          path: luaux-worm-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: archives/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
