[package]
name = "luaux-worm"
# The version that a project names in `[worms]`, and the tag that carries the
# release: `luaux = "larvae-luau/luaux-worm@0.1.0-beta"`.
version = "0.1.0"
edition = "2024"
# The 2024 edition asks for this, and nothing here asks for more.
rust-version = "1.85"
description = "A larvae worm that gives .luaux files a compiler, a formatter, and a linter"
license = "MIT"
repository = "https://github.com/larvae-luau/luaux-worm"
homepage = "https://github.com/larvae-luau/luaux-worm"
keywords = ["luau", "larvae", "luaux", "roblox", "worm"]
categories = ["development-tools::build-utils"]
# A worm ships as an executable in a release, and a project takes it from
# GitHub. Nothing here is a library, so nothing goes to crates.io.
publish = false

[dependencies]
# The `native` feature brings in `larvae_worm::native`, which owns the stdin and
# stdout protocol. The module does not compile in without the feature.
# 0.1.2-beta carries Settings on init, Format::spans, the lint shadow, and the
# node API of the wasm form behind `target_arch = "wasm32"`, which is what lets
# a native worm link on windows.
larvae-worm = { version = "0.1.2-beta", features = ["native"] }
luaux = "0.1.3"
# `luaux.toml` and the `[worms.luaux.config]` table of larvae are TOML.
toml = "1"
# larvae sends the resolved `[fmt]` table of the project as JSON.
serde_json = "1"
# larvae formats a whole statement and refuses less, so the worm parses the
# shadow of the file to find where each statement ends. This is the parser that
# luaux uses as well, so the two agree about the same bytes.
full_moon = { version = "2.2.0", features = ["luau"] }
